  #     - name: Terraform Init
  #       run: terraform init
  #       env:
  #         # ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  #         # ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  #         # ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  #         # ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  #         TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  #         TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  #         TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
  #         TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  #     - name: Terraform Plan
  #       run: terraform plan -out=tfplan
  #       env:
  #         ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  #         ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  #         ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  #         ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  #         TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  #         TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  #         TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
  #         TF_VAR_azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
  #         TF_VAR_ssh_public_key: ${{ secrets.AZURE_SSH_PUBLIC_KEY }}

  #     - name: Upload Terraform Plan
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: tfplan
  #         path: ${{ env.WORKING_DIRECTORY }}/tfplan
  #         retention-days: 1

  #     - name: Comment Plan on PR
  #       if: github.event_name == 'pull_request'
  #       uses: actions/github-script@v6
  #       with:
  #         github-token: ${{ secrets.GITHUB_TOKEN }}
  #         script: |
  #           const fs = require('fs');
  #           const plan = fs.readFileSync('${{ env.WORKING_DIRECTORY }}/tfplan.txt', 'utf8');
            
  #           github.rest.issues.createComment({
  #             issue_number: context.issue.number,
  #             owner: context.repo.owner,
  #             repo: context.repo.repo,
  #             body: `## Terraform Plan\n\n\`\`\`\n${plan}\n\`\`\``
  #           });

  # ============================================================================
  # Job 4: Security Scanning (Optional)
  # ============================================================================
  security:
    name: Security Scan (tfsec)
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ env.WORKING_DIRECTORY }}
        continue-on-error: true

  # ============================================================================
  # Job 5: Apply (Only on push to main branch)
  # ============================================================================
  apply:
    name: Apply Infrastructure Changes
    runs-on: ubuntu-latest
    needs: [plan, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve secrets from Azure Key Vault
        id: keyvault
        run: |
          echo "Retrieving secrets from Azure Key Vault..."
          KEYVAULT_NAME="${{ secrets.AZURE_KEYVAULT_NAME }}"
          
          # Get SSH public key
          SSH_PUBLIC_KEY=$(az keyvault secret show --name "ssh-public-key" --vault-name "$KEYVAULT_NAME" --query "value" -o tsv)
          echo "::add-mask::$SSH_PUBLIC_KEY"
          echo "ssh_public_key=$SSH_PUBLIC_KEY" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIRECTORY }}

      - name: Terraform Init
        run: terraform init
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_ssh_public_key: ${{ steps.keyvault.outputs.ssh_public_key }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_ssh_public_key: ${{ steps.keyvault.outputs.ssh_public_key }}

      - name: Get Terraform Outputs
        run: terraform output -json > outputs.json
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: ${{ env.WORKING_DIRECTORY }}/outputs.json

      - name: Notify Success
        if: success()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number || null,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Terraform Apply completed successfully!'
            }).catch(() => {
              console.log('Could not create comment (not in PR context)');
            });

      - name: Notify Failure
        if: failure()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number || null,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Terraform Apply failed! Check the logs for details.'
            }).catch(() => {
              console.log('Could not create comment (not in PR context)');
            });

  # ========================================================================
  # Job 6: Post-Deploy Configuration (Deploy Containers)
  # ========================================================================
  post-deploy:
    name: Deploy srsRAN Containers
    runs-on: ubuntu-latest
    needs: apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve secrets from Azure Key Vault
        id: keyvault
        run: |
          echo "Retrieving secrets from Azure Key Vault..."
          KEYVAULT_NAME="${{ secrets.AZURE_KEYVAULT_NAME }}"
          # Get SSH private key for VM access
          SSH_PRIVATE_KEY=$(az keyvault secret show --name "ssh-private-key" --vault-name "$KEYVAULT_NAME" --query "value" -o tsv)
          echo "::add-mask::$SSH_PRIVATE_KEY"
          echo "ssh_private_key=$SSH_PRIVATE_KEY" >> $GITHUB_OUTPUT

      - name: Download Terraform Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs

      - name: Extract IP Addresses
        id: ips
        run: |
          CORE_IP=$(jq -r '.core_vm_public_ip.value' outputs.json)
          UE_IP=$(jq -r '.ue_vm_public_ip.value' outputs.json)
          echo "core_ip=$CORE_IP" >> $GITHUB_OUTPUT
          echo "ue_ip=$UE_IP" >> $GITHUB_OUTPUT

      - name: Deploy containers on Core VM
        run: |
          mkdir -p ~/.ssh
          echo "${{ steps.keyvault.outputs.ssh_private_key }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          ssh-keyscan -H ${{ steps.ips.outputs.core_ip }} >> ~/.ssh/known_hosts
          
          ssh azureuser@${{ steps.ips.outputs.core_ip }} << 'EOF'
          echo "Installing Docker Compose..."
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
          
          echo "Starting srsRAN Core containers..."
          # TODO: Add docker-compose up commands
          sudo docker ps
          EOF

      - name: Deploy containers on UE VM
        run: |
          ssh-keyscan -H ${{ steps.ips.outputs.ue_ip }} >> ~/.ssh/known_hosts
          
          ssh azureuser@${{ steps.ips.outputs.ue_ip }} << 'EOF'
          echo "Installing Docker Compose..."
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
          
          echo "Starting srsRAN UE containers..."
          # TODO: Add docker-compose up commands
          sudo docker ps
          EOF
