name: Terraform CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'

env:
  TF_VERSION: 1.5.0
  WORKING_DIRECTORY: ./terraform

jobs:
  # ============================================================================
  # Job 1: Terraform Format Check
  # ============================================================================
  format:
    name: Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
        continue-on-error: true

  # ============================================================================
  # Job 2: Terraform Validation
  # ============================================================================
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    needs: format
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

  # ============================================================================
  # Job 3: Terraform Plan
  # ============================================================================
  plan:
    name: Plan Infrastructure
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve secrets from Azure Key Vault
        id: keyvault
        run: |
          echo "Retrieving secrets from Azure Key Vault..."
          
          # Retrieve secrets from Key Vault (replace 'your-keyvault-name' with your actual Key Vault name)
          KEYVAULT_NAME="${{ secrets.AZURE_KEYVAULT_NAME }}"
          
          # Get SSH public key
          SSH_PUBLIC_KEY=$(az keyvault secret show --name "ssh-public-key" --vault-name "$KEYVAULT_NAME" --query "value" -o tsv)
          echo "::add-mask::$SSH_PUBLIC_KEY"
          echo "ssh_public_key=$SSH_PUBLIC_KEY" >> $GITHUB_OUTPUT
          
          # Optional: Get additional secrets if needed
          # CLIENT_SECRET=$(az keyvault secret show --name "azure-client-secret" --vault-name "$KEYVAULT_NAME" --query "value" -o tsv)
          # echo "::add-mask::$CLIENT_SECRET"
          # echo "client_secret=$CLIENT_SECRET" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_ssh_public_key: ${{ steps.keyvault.outputs.ssh_public_key }}
        run: terraform init

      - name: Terraform Plan
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_ssh_public_key: ${{ steps.keyvault.outputs.ssh_public_key }}
        run: terraform plan -out=tfplan

  # plan:
  #   name: Plan Infrastructure
  #   runs-on: ubuntu-latest
  #   needs: validate
  #   defaults:
  #     run:
  #       working-directory: ${{ env.WORKING_DIRECTORY }}

  #   steps:
