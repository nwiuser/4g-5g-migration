apiVersion: apps/v1
kind: Deployment
metadata:
  name: srsepc
  labels:
    app: srsepc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srsepc
  template:
    metadata:
      labels:
        app: srsepc
    spec:
      containers:
      - name: srsepc
        image: srsran:latest
        imagePullPolicy: Never
        command:
          - srsepc
          - epc.conf
          - --mme.mme_bind_addr=0.0.0.0
          - --spgw.gtpu_bind_addr=0.0.0.0
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - SYS_NICE
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      restartPolicy: Always
