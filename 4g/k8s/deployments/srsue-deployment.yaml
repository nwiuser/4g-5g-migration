apiVersion: apps/v1
kind: Deployment
metadata:
  name: srsue
  labels:
    app: srsue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srsue
  template:
    metadata:
      labels:
        app: srsue
    spec:
      containers:
      - name: srsue
        image: srsran:latest
        imagePullPolicy: Never
        command:
          - srsue
          - ue.conf
          - --rf.device_name=zmq
          - --rf.device_args=tx_port=tcp://*:2001,rx_port=tcp://srsenb.default.svc.cluster.local:2000,id=ue,base_srate=23.04e6
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - SYS_NICE
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
        ports:
        - containerPort: 2001
          name: zmq-tx
          protocol: TCP
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      restartPolicy: Always
