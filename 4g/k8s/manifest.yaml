---
# Namespace pour isoler les ressources srsRAN
apiVersion: v1
kind: Namespace
metadata:
  name: srsran
  labels:
    name: srsran

---
# Deployment pour srsepc (EPC - Core Network)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srsepc
  namespace: srsran
  labels:
    app: srsepc
    component: core-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srsepc
  template:
    metadata:
      labels:
        app: srsepc
        component: core-network
    spec:
      containers:
      - name: srsepc
        image: srsran:latest
        imagePullPolicy: Never
        command:
          - srsepc
          - epc.conf
          - --mme.mme_bind_addr=0.0.0.0
          - --spgw.gtpu_bind_addr=0.0.0.0
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - SYS_NICE
          privileged: true
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      restartPolicy: Always

---
# Service pour srsepc
apiVersion: v1
kind: Service
metadata:
  name: srsepc
  namespace: srsran
  labels:
    app: srsepc
spec:
  selector:
    app: srsepc
  ports:
    - name: s1-mme
      protocol: TCP
      port: 36412
      targetPort: 36412
    - name: gtpu
      protocol: UDP
      port: 2152
      targetPort: 2152
  type: ClusterIP

---
# Deployment pour srsenb (eNodeB - Base Station)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srsenb
  namespace: srsran
  labels:
    app: srsenb
    component: radio-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srsenb
  template:
    metadata:
      labels:
        app: srsenb
        component: radio-access
    spec:
      containers:
      - name: srsenb
        image: srsran:latest
        imagePullPolicy: Never
        command:
          - srsenb
          - enb.conf
          - --enb.mme_addr=srsepc.srsran.svc.cluster.local
          - --enb.gtp_bind_addr=0.0.0.0
          - --enb.s1c_bind_addr=0.0.0.0
          - --enb_files.sib_config=sib.conf
          - --rf.device_name=zmq
          - --rf.device_args=fail_on_disconnect=true,tx_port=tcp://*:2000,rx_port=tcp://srsue.srsran.svc.cluster.local:2001,id=enb,base_srate=23.04e6
        securityContext:
          capabilities:
            add:
              - SYS_NICE
        ports:
        - containerPort: 2000
          name: zmq-tx
          protocol: TCP
        - containerPort: 36412
          name: s1-mme
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      restartPolicy: Always

---
# Service pour srsenb
apiVersion: v1
kind: Service
metadata:
  name: srsenb
  namespace: srsran
  labels:
    app: srsenb
spec:
  selector:
    app: srsenb
  ports:
    - name: zmq-tx
      protocol: TCP
      port: 2000
      targetPort: 2000
    - name: s1-mme
      protocol: TCP
      port: 36412
      targetPort: 36412
  type: ClusterIP

---
# Deployment pour srsue (UE - User Equipment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srsue
  namespace: srsran
  labels:
    app: srsue
    component: user-equipment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srsue
  template:
    metadata:
      labels:
        app: srsue
        component: user-equipment
    spec:
      containers:
      - name: srsue
        image: srsran:latest
        imagePullPolicy: Never
        command:
          - srsue
          - ue.conf
          - --rf.device_name=zmq
          - --rf.device_args=tx_port=tcp://*:2001,rx_port=tcp://srsenb.srsran.svc.cluster.local:2000,id=ue,base_srate=23.04e6
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - SYS_NICE
          privileged: true
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
        ports:
        - containerPort: 2001
          name: zmq-tx
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      restartPolicy: Always

---
# Service pour srsue
apiVersion: v1
kind: Service
metadata:
  name: srsue
  namespace: srsran
  labels:
    app: srsue
spec:
  selector:
    app: srsue
  ports:
    - name: zmq-tx
      protocol: TCP
      port: 2001
      targetPort: 2001
  type: ClusterIP
