---
apiVersion: v1
kind: ConfigMap
metadata:
  name: srsenb-config
  namespace: srsran
data:
  enb.conf: |
    [enb]
    enb_id = 0x19B
    mcc = 001
    mnc = 01
    mme_addr = srsepc.srsran.svc.cluster.local
    gtp_bind_addr = 0.0.0.0
    s1c_bind_addr = 0.0.0.0
    n_prb = 50
    
    [enb_files]
    sib_config = sib.conf
    rr_config  = rr.conf
    rb_config = rb.conf
    
    [rf]
    device_name = zmq
    device_args = fail_on_disconnect=true,tx_port=tcp://*:2000,rx_port=tcp://srsue.srsran.svc.cluster.local:2001,id=enb,base_srate=23.04e6
    tx_gain = 80
    rx_gain = 40
    
    [pcap]
    enable = false
    
    [log]
    all_level = info
    all_hex_limit = 32
    filename = /tmp/enb.log
    
    [gui]
    enable = false
    
  sib.conf: |
    sib1 =
    {
        intra_freq_reselection = "Allowed";
        q_rx_lev_min = -65;
        p_max = 3;
        cell_barred = "NotBarred"
        si_window_length = 20;
        sched_info =
        (
            {
                si_periodicity = 16;
                si_mapping_info = [ 2 ];
            }
        );
        system_info_value_tag = 0;
    };
    
    sib2 =
    {
        rr_config_common_sib =
        {
            rach_cnfg =
            {
                num_ra_preambles = 52;
                preamble_init_rx_target_pwr = -104;
                pwr_ramping_step = 6;
                preamble_trans_max = 10;
                ra_resp_win_size = 10;
                mac_con_res_timer = 64;
                max_harq_msg3_tx = 4;
            };
            bcch_cnfg =
            {
                modification_period_coeff = 16;
            };
            pcch_cnfg =
            {
                default_paging_cycle = 32;
                nB = "1";
            };
            prach_cnfg =
            {
                root_sequence_index = 128;
                prach_cnfg_info =
                {
                    high_speed_flag = false;
                    prach_config_index = 3;
                    prach_freq_offset = 2;
                    zero_correlation_zone_config = 5;
                };
            };
            pdsch_cnfg =
            {
                p_b = 0;
                rs_power = 20;
            };
            pusch_cnfg =
            {
                n_sb = 1;
                hopping_mode = "inter-subframe";
                pusch_hopping_offset = 2;
                enable_64_qam = false;
                ul_rs =
                {
                    cyclic_shift = 0;
                    group_assignment_pusch = 0;
                    group_hopping_enabled = false;
                    sequence_hopping_enabled = false;
                };
            };
            pucch_cnfg =
            {
                delta_pucch_shift = 1;
                n_rb_cqi = 2;
                n_cs_an = 0;
                n1_pucch_an = 12;
            };
            ul_pwr_ctrl =
            {
                p0_nominal_pusch = -85;
                alpha = 0.7;
                p0_nominal_pucch = -107;
                delta_flist_pucch =
                {
                    format_1 = 0;
                    format_1b = 3;
                    format_2 = 1;
                    format_2a = 2;
                    format_2b = 2;
                };
                delta_preamble_msg3 = 6;
            };
            ul_cp_length = "len1";
        };
        
        ue_timers_and_constants =
        {
            t300 = 2000;
            t301 = 100;
            t310 = 200;
            n310 = 1;
            t311 = 10000;
            n311 = 1;
        };
        
        freqInfo =
        {
            ul_carrier_freq_present = true;
            ul_bw_present = true;
            additional_spectrum_emission = 1;
        };
        
        time_alignment_timer = "INFINITY";
    };
    
  rr.conf: |
    mac_cnfg =
    {
      phr_cnfg =
      {
        dl_pathloss_change = "dB3";
        periodic_phr_timer = 50;
        prohibit_phr_timer = 0;
      };
      ulsch_cnfg =
      {
        max_harq_tx = 4;
        periodic_bsr_timer = 20;
        retx_bsr_timer = 320;
      };
      
      time_alignment_timer = -1;
    };
    
    phy_cnfg =
    {
      phich_cnfg =
      {
        duration = "Normal";
        resources = "1/6";
      };
      
      pusch_cnfg_ded =
      {
        beta_offset_ack_idx = 6;
        beta_offset_ri_idx = 6;
        beta_offset_cqi_idx = 6;
      };
      
      sched_request_cnfg =
      {
        dsr_trans_max = 64;
        period = 20;
        nof_prb = 2;
      };
      
      cqi_report_cnfg =
      {
        mode = "periodic";
        simultaneousAckCQI = true;
        period = 40;
        nof_prb = 2;
        m_ri = 8;
      };
    };
    
  rb.conf: |
    qci_config = (
      {
        qci = 9;
        pdcp_config = {
          discard_timer = -1;
          pdcp_sn_size = 12;
        }
        rlc_config = {
          ul_am = {
            t_poll_retx = 120;
            poll_pdu = 64;
            poll_byte = 750;
            max_retx_thresh = 16;
          };
          dl_am = {
            t_reordering = 50;
            t_status_prohibit = 50;
          };
        };
        logical_channel_config = {
          priority = 13;
          prioritized_bit_rate = -1;
          bucket_size_duration = 100;
          log_chan_group = 2;
        };
      }
    );
