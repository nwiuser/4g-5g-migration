# Déploiement complet de srsRAN sur Kubernetes
# Appliquer avec: kubectl apply -f deploy-all.yaml

---
apiVersion: v1
kind: Service
metadata:
  name: srsepc
  labels:
    app: srsepc
spec:
  selector:
    app: srsepc
  ports:
    - name: s1-mme
      protocol: TCP
      port: 36412
      targetPort: 36412
    - name: gtpu
      protocol: UDP
      port: 2152
      targetPort: 2152
  clusterIP: None

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srsepc
  labels:
    app: srsepc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srsepc
  template:
    metadata:
      labels:
        app: srsepc
    spec:
      containers:
      - name: srsepc
        image: nouisser1/srsepc-4g:latest
        imagePullPolicy: Always
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - SYS_NICE
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: srsenb
  labels:
    app: srsenb
spec:
  selector:
    app: srsenb
  ports:
    - name: zmq-tx
      protocol: TCP
      port: 2000
      targetPort: 2000
  clusterIP: None

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srsenb
  labels:
    app: srsenb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srsenb
  template:
    metadata:
      labels:
        app: srsenb
    spec:
      initContainers:
      - name: wait-for-epc
        image: busybox:1.35
        command: ['sh', '-c', 'echo "Waiting for EPC to be ready..."; sleep 15; echo "EPC should be ready now"']
      containers:
      - name: srsenb
        image: nouisser1/srsenb-4g:latest
        imagePullPolicy: Always
        command:
          - sh
          - -c
          - |
            MME_ADDR=$(getent hosts srsepc.default.svc.cluster.local | awk '{ print $1 }')
            echo "EPC IP Address: $MME_ADDR"
            srsenb enb.conf \
              --enb.mme_addr=$MME_ADDR \
              --enb.gtp_bind_addr=0.0.0.0 \
              --enb.s1c_bind_addr=0.0.0.0 \
              --enb_files.sib_config=sib.conf \
              --rf.device_name=zmq \
              --rf.device_args=fail_on_disconnect=true,tx_port=tcp://*:2000,rx_port=tcp://srsue.default.svc.cluster.local:2001,id=enb,base_srate=23.04e6
        securityContext:
          capabilities:
            add:
              - SYS_NICE
        ports:
        - containerPort: 2000
          name: zmq-tx
          protocol: TCP
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: srsue
  labels:
    app: srsue
spec:
  selector:
    app: srsue
  ports:
    - name: zmq-tx
      protocol: TCP
      port: 2001
      targetPort: 2001
  clusterIP: None

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srsue
  labels:
    app: srsue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srsue
  template:
    metadata:
      labels:
        app: srsue
    spec:
      containers:
      - name: srsue
        image: nouisser1/srsue-4g:latest
        imagePullPolicy: Always
        command:
          - srsue
          - ue.conf
          - --rf.device_name=zmq
          - --rf.device_args=tx_port=tcp://*:2001,rx_port=tcp://srsenb.default.svc.cluster.local:2000,id=ue,base_srate=23.04e6
        securityContext:
          privileged: true
          capabilities:
            add:
              - NET_ADMIN
              - SYS_NICE
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
        ports:
        - containerPort: 2001
          name: zmq-tx
          protocol: TCP
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice
      restartPolicy: Always
