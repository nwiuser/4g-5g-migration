## WebUI Configuration
webui:
  enabled: true
  replicaCount: 1
  image:
    repository: openverso/open5gs
    tag: "2.7.0"
  service:
    type: NodePort
    port: 9999
    nodePort: 31999
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: webui-5g.local
        paths:
          - path: /
            pathType: Prefix

## Metrics and Monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

## Auto-scaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
