{{- if .Values.amf.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-amf-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
    component: amf
data:
  amf.yaml: |
    logger:
      level: info

    amf:
      sbi:
        - addr: 0.0.0.0
          port: 7777
      ngap:
      {{- range .Values.amf.config.ngap }}
        - addr: {{ .addr }}
      {{- end }}
      metrics:
      {{- range .Values.amf.config.metrics }}
        - addr: {{ .addr }}
          port: {{ .port }}
      {{- end }}
      guami:
      {{- range .Values.amf.config.guami }}
        - plmn_id:
            mcc: {{ .plmn_id.mcc | quote }}
            mnc: {{ .plmn_id.mnc | quote }}
          amf_id:
            region: {{ .amf_id.region }}
            set: {{ .amf_id.set }}
      {{- end }}
      tai:
        - plmn_id:
            mcc: {{ .Values.global.network.plmnId.mcc | quote }}
            mnc: {{ .Values.global.network.plmnId.mnc | quote }}
          tac: {{ .Values.global.network.tac }}
      plmn_support:
        - plmn_id:
            mcc: {{ .Values.global.network.plmnId.mcc | quote }}
            mnc: {{ .Values.global.network.plmnId.mnc | quote }}
          s_nssai:
          {{- range .Values.slicing.slices }}
            - sst: {{ .sst }}
              {{- if .sd }}
              sd: {{ .sd | quote }}
              {{- end }}
          {{- end }}
      security:
        integrity_order: [NIA2, NIA1, NIA0]
        ciphering_order: [NEA0, NEA1, NEA2]
      network_name:
        full: Open5GS
        short: Next
      amf_name: open5gs-amf0

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "open5gs-5g.fullname" . }}-amf
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
    component: amf
spec:
  replicas: {{ .Values.amf.replicaCount }}
  selector:
    matchLabels:
      {{- include "open5gs-5g.selectorLabels" . | nindent 6 }}
      component: amf
  template:
    metadata:
      labels:
        {{- include "open5gs-5g.selectorLabels" . | nindent 8 }}
        component: amf
    spec:
      initContainers:
      - name: wait-mongodb
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ .Values.global.mongodb.host }} {{ .Values.global.mongodb.port }}; do echo waiting for mongodb; sleep 2; done']
      containers:
      - name: amf
        image: "{{ .Values.amf.image.repository }}:{{ .Values.amf.image.tag }}"
        imagePullPolicy: Always
        command: ["sh", "-c"]
        args:
          - |
            # Increase file descriptor limits
            ulimit -n 65536
            
            # Find the open5gs-amfd binary
            if [ -x /bin/open5gs-amfd ]; then
              /bin/open5gs-amfd -c /mnt/amf/amf.yaml
            elif [ -x /usr/bin/open5gs-amfd ]; then
              /usr/bin/open5gs-amfd -c /mnt/amf/amf.yaml
            else
              open5gs-amfd -c /mnt/amf/amf.yaml
            fi
        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_RESOURCE
        env:
        - name: COMPONENT_NAME
          value: "amf"
        - name: MONGODB_HOST
          value: {{ .Values.global.mongodb.host }}
        - name: MONGODB_PORT
          value: {{ .Values.global.mongodb.port | quote }}
        ports:
        - name: ngap
          containerPort: {{ .Values.amf.service.ngapPort }}
          protocol: SCTP
        - name: sbi
          containerPort: {{ .Values.amf.service.sbiPort }}
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        volumeMounts:
        - name: amf-config
          mountPath: /mnt/amf
        resources:
          {{- toYaml .Values.amf.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: sbi
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: sbi
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: amf-config
        configMap:
          name: {{ include "open5gs-5g.fullname" . }}-amf-config

---
apiVersion: v1
kind: Service
metadata:
  name: amf
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "open5gs-5g.labels" . | nindent 4 }}
    component: amf
spec:
  type: {{ .Values.amf.service.type }}
  ports:
  - name: ngap
    port: {{ .Values.amf.service.ngapPort }}
    targetPort: ngap
    protocol: SCTP
  - name: sbi
    port: {{ .Values.amf.service.sbiPort }}
    targetPort: sbi
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    {{- include "open5gs-5g.selectorLabels" . | nindent 4 }}
    component: amf
{{- end }}
