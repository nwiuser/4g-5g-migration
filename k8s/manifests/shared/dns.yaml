---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-config
  namespace: shared-services
data:
  named.conf: |
    options {
        directory "/var/cache/bind";
        recursion yes;
        allow-query { any; };
        forwarders {
            8.8.8.8;
            8.8.4.4;
        };
    };

    zone "epc.mnc001.mcc001.3gppnetwork.org" {
        type master;
        file "/etc/bind/epc_zone";
    };

    zone "ims.mnc001.mcc001.3gppnetwork.org" {
        type master;
        file "/etc/bind/ims_zone";
    };

    zone "5gc.mnc001.mcc001.3gppnetwork.org" {
        type master;
        file "/etc/bind/5gc_zone";
    };

  epc_zone: |
    $TTL 1
    @   IN  SOA epc.mnc001.mcc001.3gppnetwork.org. admin.epc.mnc001.mcc001.3gppnetwork.org. (
                1    ; Serial
                60   ; Refresh
                60   ; Retry
                60   ; Expire
                60 ) ; Minimum TTL
        IN  NS  ns.epc.mnc001.mcc001.3gppnetwork.org.
    
    ns              IN  A   10.96.0.10
    mme             IN  A   10.45.0.2
    hss             IN  A   10.45.0.3
    pcrf            IN  A   10.45.0.4
    sgwc            IN  A   10.45.0.5
    sgwu            IN  A   10.45.0.6
    smf             IN  A   10.45.0.7
    upf             IN  A   10.45.0.8

  ims_zone: |
    $TTL 1
    @   IN  SOA ims.mnc001.mcc001.3gppnetwork.org. admin.ims.mnc001.mcc001.3gppnetwork.org. (
                1    ; Serial
                60   ; Refresh
                60   ; Retry
                60   ; Expire
                60 ) ; Minimum TTL
        IN  NS  ns.ims.mnc001.mcc001.3gppnetwork.org.
    
    ns              IN  A   10.96.0.10
    pcscf           IN  A   10.45.0.20
    icscf           IN  A   10.45.0.21
    scscf           IN  A   10.45.0.22

  5gc_zone: |
    $TTL 1
    @   IN  SOA 5gc.mnc001.mcc001.3gppnetwork.org. admin.5gc.mnc001.mcc001.3gppnetwork.org. (
                1    ; Serial
                60   ; Refresh
                60   ; Retry
                60   ; Expire
                60 ) ; Minimum TTL
        IN  NS  ns.5gc.mnc001.mcc001.3gppnetwork.org.
    
    ns              IN  A   10.96.0.10
    amf             IN  A   10.46.0.2
    smf             IN  A   10.46.0.3
    upf             IN  A   10.46.0.4
    ausf            IN  A   10.46.0.5
    udm             IN  A   10.46.0.6
    udr             IN  A   10.46.0.7
    nrf             IN  A   10.46.0.8
    nssf            IN  A   10.46.0.9
    pcf             IN  A   10.46.0.10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns
  namespace: shared-services
  labels:
    app: dns
    component: dns-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dns
  template:
    metadata:
      labels:
        app: dns
        component: dns-server
    spec:
      containers:
      - name: dns
        image: docker_dns:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 53
          protocol: UDP
          name: dns-udp
        - containerPort: 53
          protocol: TCP
          name: dns-tcp
        volumeMounts:
        - name: dns-config
          mountPath: /etc/bind
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: dns-config
        configMap:
          name: dns-config
---
apiVersion: v1
kind: Service
metadata:
  name: dns
  namespace: shared-services
  labels:
    app: dns
spec:
  type: ClusterIP
  clusterIP: 10.96.0.10
  ports:
  - port: 53
    targetPort: 53
    protocol: UDP
    name: dns-udp
  - port: 53
    targetPort: 53
    protocol: TCP
    name: dns-tcp
  selector:
    app: dns
