# Configuration pour l'environnement de développement
# Note: Seulement MME+WebUI pour 4G et AMF pour 5G sont disponibles actuellement

## Ressources minimales
global:
  environment: dev

## 4G Core - Seulement MME et WebUI disponibles
open5gs-4g:
  mme:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"
  
  webui:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"

## 5G Core - Seulement AMF disponible
open5gs-5g:
  amf:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"
        memory: "256Mi"
        cpu: "150m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  smf:

## Monitoring - Configuration basique (désactivé pour tests initiaux)
monitoring:
  enabled: false
  prometheus:
    retention: 7d
    storageSize: 10Gi
  grafana:
    persistence:
      enabled: false

## Logging
logging:
  level: debug
  retention: 3d

## MongoDB - Utilise le service partagé
mongodb:
  external: true
  host: mongodb.shared-services
  port: 27017
  
## DNS - Utilise le service partagé
dns:
  external: true
  host: dns.shared-services
  port: 53
