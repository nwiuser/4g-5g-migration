# Configuration pour l'environnement de développement

## Ressources minimales
global:
  environment: dev

## 4G Core - Resources minimales
open5gs-4g:
  mme:
    replicaCount: 1
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"
  hss:
    replicaCount: 1
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "150m"
  sgwc:
    replicaCount: 1
  sgwu:
    replicaCount: 1
  smf:
    replicaCount: 1
  upf:
    replicaCount: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "1Gi"
        cpu: "500m"

## 5G Core - Resources minimales
open5gs-5g:
  nrf:
    replicaCount: 1
  amf:
    replicaCount: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "150m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  smf:
    replicaCount: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "150m"
      limits:
        memory: "1Gi"
        cpu: "500m"
  upf:
    replicaCount: 1
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
  ausf:
    replicaCount: 1
  udm:
    replicaCount: 1
  udr:
    replicaCount: 1
  pcf:
    replicaCount: 1
  nssf:
    replicaCount: 1
  bsf:
    replicaCount: 1
  
  # Network Slicing - Configuration simple
  slicing:
    enabled: true
    slices:
      - sst: 1  # eMBB
        sd: "000001"
        dnn: internet
  
  # Auto-scaling désactivé en dev
  autoscaling:
    enabled: false

## Monitoring - Configuration basique
monitoring:
  prometheus:
    retention: 7d
    storageSize: 10Gi
  grafana:
    persistence:
      enabled: false

## Logging
logging:
  level: debug
  retention: 3d
