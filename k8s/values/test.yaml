  # Disable all components without templates  
  nrf:
    enabled: false
  scp:
    enabled: false
  smf:
    enabled: false
  upf:
    enabled: false
  ausf:
    enabled: false
  udm:
    enabled: false
  udr:
    enabled: false
  pcf:
    enabled: false
  nssf:
    enabled: false
  bsf:
    enabled: false
  slicing:
    enabled: false
  autoscaling:
