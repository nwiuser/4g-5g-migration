# Minimal test configuration - Only components with templates

global:
  environment: test
  imageRegistry: docker.io
  imagePullPolicy: IfNotPresent
  
  network:
    plmnId:
      mcc: "001"
      mnc: "01"
    tac: 7
    
  mongodb:
    enabled: true
    host: mongodb.shared-services.svc.cluster.local
    port: 27017
    database: open5gs
    username: admin
    passwordSecret: mongodb-secret
    
  dns:
    enabled: true
    server: dns.shared-services.svc.cluster.local

## 4G Core - Only MME and WebUI (templates exist)
open5gs-4g:
  mme:
    enabled: true
    replicaCount: 1
    image:
      repository: herlesupreeth/docker_open5gs
      tag: latest
    service:
      s1apPort: 36412
      gtpcPort: 2123
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"
    config:
      s1ap:
        - addr: 0.0.0.0
      gtpc:
        - addr: 10.45.0.2
      metrics:
        - addr: 0.0.0.0
          port: 9090
  
  webui:
    enabled: true
    replicaCount: 1
    image:
      repository: herlesupreeth/docker_open5gs
      tag: latest
    service:
      type: NodePort
      port: 9999
      nodePort: 30999
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
  
  # Disable all components without templates
  hss:
    enabled: false
  pcrf:
    enabled: false
  sgwc:
    enabled: false
  sgwu:
    enabled: false
  smf:
    enabled: false
  upf:
    enabled: false
  metrics:
    enabled: false

## 5G Core - Only AMF (template exists)
open5gs-5g:
  amf:
    enabled: true
    replicaCount: 1
    image:
      repository: herlesupreeth/docker_open5gs
      tag: latest
    service:
      ngapPort: 38412
      sbiPort: 7777
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "300m"
    config:
      ngap:
        - addr: 0.0.0.0
      metrics:
        - addr: 0.0.0.0
          port: 9090
      guami:
        - plmn_id:
            mcc: "001"
            mnc: "01"
          amf_id:
            region: 2
            set: 1
  
  # Network slicing configuration (required by AMF template)
  slicing:
    enabled: true
    slices:
      - sst: 1
        sd: "000001"
  
  # Disable all components without templates  
  nrf:
    enabled: false
  scp:
    enabled: false
  smf:
    enabled: false
  upf:
    enabled: false
  ausf:
    enabled: false
  udm:
    enabled: false
  udr:
    enabled: false
  pcf:
    enabled: false
  nssf:
    enabled: false
  bsf:
    enabled: false
  autoscaling:
    enabled: false
  metrics:
    enabled: false
